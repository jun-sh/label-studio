# Reverse proxy to self-hosted LeRobot Dataset Visualizer (independent service).
# Upstream hostname on compose network: lerobot

# Visualizer resolves manifest against origin root when base is path-only (/lerobot/).
location = /sample-datasets.manifest.json {
    proxy_pass http://lerobot:7860/lerobot/sample-datasets.manifest.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
}

location /lerobot {
    absolute_redirect off;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Content-Length 0 always;
        return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /lerobot;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 90;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;
    proxy_buffering off;

    proxy_redirect http://lerobot:7860/lerobot/ /lerobot/;
    proxy_redirect http://lerobot:7860/lerobot /lerobot;
    proxy_redirect /lerobot/ /lerobot/;
    proxy_redirect /lerobot /lerobot;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_pass http://lerobot:7860;
}
