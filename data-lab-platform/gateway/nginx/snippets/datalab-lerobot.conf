# Reverse proxy to self-hosted LeRobot Dataset Visualizer (independent service).
# Upstream hostname on compose network: lerobot

location /lerobot {
    absolute_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /lerobot;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_connect_timeout 90;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    send_timeout 300;

    # Rewrite upstream redirects (Next.js trailing-slash) to stay on gateway port.
    proxy_redirect http://lerobot:7860/lerobot/ /lerobot/;
    proxy_redirect http://lerobot:7860/lerobot /lerobot;
    proxy_redirect /lerobot/ /lerobot/;
    proxy_redirect /lerobot /lerobot;

    # Allow embedding in Label Studio shell (same origin via gateway).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_pass http://lerobot:7860;
}
