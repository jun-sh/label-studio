# v0.0.9 edge capture: append H264 on 130, mux to MP4 on 34 ingest (fast segment close).
# Prerequisite on 130: OAK HW H264. ffmpeg required on 34 stream-ingest, not on edge close path.
[Service]
Environment=OAK_HW_JPEG=0
Environment=OAK_H264=1
Environment=OAK_HW_PREVIEW_H264=0
Environment=OAK_H264_SEQUENTIAL=1
Environment=OAK_H264_BITRATE_KBPS=6000
Environment=OAK_H264_KEYFRAME_FREQUENCY=30
Environment=OAK_CAM_QUEUE_MAX=32
Environment=SEGMENT_H264=1
Environment=SEGMENT_H264_LEGACY_APPEND=1
Environment=SEGMENT_FRAME_BIN=0
Environment=EGO_TOPOLOGY_FILE=/home/server/workspace/ego-studio/src/ego_capture_studio/capture/config/camera_topology_standard.json
Environment=EGO_SEGMENT_PERSIST_QUEUE_MAX=2048
Environment=UPLOAD_PROTOCOL=tarzst
