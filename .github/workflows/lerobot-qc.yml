name: lerobot-qc

on:
  push:
    branches: [main]
    paths:
      - "data-lab-platform/lerobot-qc/**"
      - ".github/workflows/lerobot-qc.yml"
  pull_request:
    paths:
      - "data-lab-platform/lerobot-qc/**"
      - ".github/workflows/lerobot-qc.yml"
  workflow_dispatch:

concurrency:
  group: lerobot-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data-lab-platform/lerobot-qc/backend
    steps:
      - uses: actions/checkout@v4

      # Same Python minor as the QC container; no lerobot, like the container.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: data-lab-platform/lerobot-qc/backend/requirements*.txt

      # Rebuild and acceptance tests encode and decode real h264 / ffv1 gray16le videos.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check frontend syntax
        run: for f in static/*.js; do node --check "$f"; done

      - name: Run tests
        run: python -m pytest -q tests
