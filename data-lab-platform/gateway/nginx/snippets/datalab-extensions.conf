# Static Data Lab shell extension (menu inject + iframe host).
# Mounted from compose: ./data-lab-platform/client -> /extensions

location = /_datalab/shell.js {
    alias /extensions/shell.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Datalab-Shell-Version "10" always;
    etag off;
    if_modified_since off;
}

location = /_datalab/shell.css {
    alias /extensions/shell.css;
    default_type text/css;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
}

location /_datalab/ {
    alias /extensions/;
    default_type application/octet-stream;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}
