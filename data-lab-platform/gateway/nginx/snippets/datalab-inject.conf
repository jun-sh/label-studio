# Inject shell only into Label Studio SPA pages (base.html has .app-wrapper).
# Login/simple pages are not matched — avoids stray scripts on login.

sub_filter '<div class="app-wrapper"></div>' '<link rel="stylesheet" href="/_datalab/shell.css?v=6"/><script defer src="/_datalab/shell.js?v=6" data-route="/lerobot-data" data-iframe-src="/lerobot/?url=sample%3A%2F%2Fsensexperience_ego" data-menu-label="数据"></script><div class="app-wrapper"></div>';
sub_filter_once on;
sub_filter_types text/html;
