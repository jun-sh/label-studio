# Local segment store is an upload queue (not long-term archive).
# Align capture backpressure with ecs-upload-segments-loop (KEEP_PENDING_BELOW=12).
[Service]
Environment=EGO_SEGMENT_QUOTA_GB=256
Environment=EGO_SEGMENT_MAX_PENDING=12
Environment=SEGMENT_AUTO_PURGE_PENDING=1
Environment=SEGMENT_BACKPRESSURE_PENDING=1
