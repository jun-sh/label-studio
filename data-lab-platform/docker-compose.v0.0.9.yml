# v0.0.9: v0.0.8 primary path + hard-fail on missing/broken segment MP4 (no staging fallback).
# Usage from repo root:
#   docker build -t data-lab-lerobot-studio:v0.0.9 data-lab-platform/lerobot-studio
#   docker-compose -f docker-compose.yml \
#     -f data-lab-platform/docker-compose.platform.yml \
#     -f data-lab-platform/docker-compose.storage.override.yml \
#     -f data-lab-platform/docker-compose.v0.0.9.yml \
#     up -d stream-ingest

services:
  stream-ingest:
    image: data-lab-lerobot-studio:v0.0.9
    volumes: !reset
      - ./data-storage/stream:/srv/stream
      - ./data-storage/ego-archive:/cold-archive:rw
      - ./data-lab-platform/lerobot-studio/config/collection-station-tokens.json:/app/config/collection-station-tokens.json:ro
      - ./data-lab-platform/lerobot-studio/config/collection-stations.json:/app/config/collection-stations.json:ro
      - ./data-lab-platform/lerobot-studio/config/station-topology.json:/app/config/station-topology.json:ro
    environment:
      - STREAM_DATA_ROOT=/srv/stream
      - STREAM_PRIMARY_PATH=segment_mp4
      - STREAM_FRAME_PUSH=0
      - DERIVE_ASYNC=0
      - DERIVE_ASYNC_EGO_001=0
      - DERIVE_ASYNC_EGO_LAN_214=0
      - STREAM_QUOTA_GB=400
      - STREAM_RETENTION_DAYS=7
      - STREAM_BACKGROUND_BATCH_MS=2000
      - STREAM_SEGMENT_INGEST_BATCH_SIZE=2
      - STREAM_STAGING_EMERGENCY_BYTES=268435456
      - STREAM_ARCHIVE_PURGE_MAX=0
      - STREAM_RAW_RETAIN_UNTIL_READY=1

  lerobot:
    image: data-lab-lerobot-studio:v0.0.9
    volumes: !reset
      - lerobot-studio-data:/srv/lerobot
      - lerobot-bundled-data:/srv/bundled
      - ./data-storage/stream:/srv/stream:rw
      - ./data-lab-platform/lerobot-studio/branding:/app/branding:ro
      - ./data-lab-platform/lerobot-studio/config/collection-stations.json:/app/config/collection-stations.json:ro
      - ./data-lab-platform/lerobot-studio/config/station-topology.json:/app/config/station-topology.json:ro

  derive-worker:
    image: data-lab-lerobot-studio:v0.0.9
