# ego-001 MCAP production — VPU H.264, replaces tar.zst ecs-record-oak-stream.
# Start capture (manual only — do not enable for boot): systemctl --user start ecs-oak-mcap-capture-stack.target
# Disable legacy: systemctl --user disable --now ecs-record-oak-stream.service

[Service]
# Do not UnsetEnvironment station/checkpoint/upload vars here: systemd applies
# UnsetEnvironment after EnvironmentFile, which strips station.conf values without
# re-applying drop-in Environment= (capture then defaults to segments/checkpoint.json).

Environment=EGO_STATION_ID=ego-001
Environment=EGO_SEGMENT_ROOT=/home/server/cache/ego-001/segments
Environment=EGO_SEGMENT_ACTIVE_ROOT=/dev/shm/ego-001-mcap-active
Environment=EGO_CAPTURE_CHECKPOINT=/home/server/cache/ego-001/checkpoint.json

Environment=SEGMENT_MCAP=1
Environment=SEGMENT_FRAME_BIN=0
Environment=UPLOAD_PROTOCOL=mcap
Environment=MCAP_VIDEO_CODEC=h264

Environment=OAK_HW_JPEG=0
Environment=OAK_H264=1
Environment=SEGMENT_H264=1
Environment=EGO_CAPTURE_JPEG_ONLY=0
Environment=STRICT_RGB_YIELD_MAX_MS=50
Environment=STRICT_DEPTH_YIELD_MAX_MS=50

# H264 sync: fsync_quad time-window pairing (replaces sequential lockstep pop).
Environment=OAK_H264_SEQUENTIAL=0
Environment=EGO_CAPTURE_SYNC_MODE=fsync_quad
Environment=EGO_CAPTURE_PARALLEL_DRAIN=1
Environment=EGO_FSYNC_QUAD_ALIGN_MAX_NS=1000000
Environment=EGO_FSYNC_QUAD_WAIT_MS=25.0
Environment=EGO_POC_RING_LEN=512
Environment=EGO_CAPTURE_WRITER_ASYNC=1
Environment=EGO_CAPTURE_FRAME_QUEUE_MAX=256
Environment=EGO_IMU_INCREMENTAL=1
Environment=EGO_PARALLEL_DRAIN_BATCH=128
Environment=EGO_PARALLEL_IDLE_SLEEP_US=50
Environment=EGO_PARALLEL_SPIN_ROUNDS=128
Environment=EGO_DEVICE_TICK_BURST_MAX=8

Environment=OAK_CAM_QUEUE_MAX=128
Environment=OAK_H264_BITRATE_KBPS=6000
Environment=OAK_H264_KEYFRAME_FREQUENCY=30
Environment=SEGMENT_H264_MUX_MODE=copy

Environment=EGO_FRAME_INTERVAL_MS=33
Environment=EGO_CAPTURE_FPS=30
Environment=EGO_CAPTURE_IMU_HZ=200
Environment=OAK_DEVICE_FPS=30
Environment=OAK_GPIO_FSYNC=1
# FSYNC pulse-rate correction. These three move together; set OAK_FSYNC_FIX=0 to
# return to the 26.1Hz legacy timing without touching code.
Environment=OAK_FSYNC_FIX=1
# Headroom buys the pulse loop catch-up room (period - sensor minimum frame
# time). Measured on ego-001: +3 gives 1.97ms and only 27.5Hz, +10 gives
# 7.19ms and 30.15Hz, +15 over-slackens the floor and regresses to 29.4Hz.
Environment=OAK_FSYNC_SENSOR_HEADROOM_FPS=10
Environment=OAK_FSYNC_MIN_GAP_GUARD_MS=1.0
Environment=OAK_AE_MAX_EXPOSURE_US=20000
# Live preview for mobile UI — low-res MJPEG sidecar per camera during record.
Environment=OAK_HW_PREVIEW_H264=1
Environment=OAK_HW_PREVIEW_H264_CAMS=front_left
Environment=PREVIEW_MAX_EDGE=384
Environment=PREVIEW_FPS=4
Environment=EGO_STRICT_SYNC_PREVIEW_DRAIN=0
Environment=EGO_CAPTURE_NO_HEARTBEAT=1

Environment=EGO_SEGMENT_MAX_SECONDS=75
Environment=EGO_SEGMENT_MAX_FRAMES=1800
Environment=SEGMENT_PERSIST_QUEUE_MAX=2048
Environment=SEGMENT_PERSIST_WORKERS=2
Environment=SEGMENT_BACKPRESSURE_PENDING=1
Environment=EGO_SEGMENT_MAX_PENDING=24
Environment=SEGMENT_FINALIZE_ASYNC=1
Environment=EGO_SEGMENT_PERSIST_BATCH_FRAMES=48
Environment=EGO_SEGMENT_ROWS_BUFFER_LINES=48

Environment=EGO_UPLOAD_URL=http://10.10.10.34:8080/lerobot/api/collection/stations/ego-001/upload
Environment=DATALAB_HEARTBEAT_URL=http://10.10.10.34:8080/lerobot/api/collection/stations/ego-001/upload
Environment=STATION_UPLOAD_TOKEN=dl-upload-ego-001-v1
Environment=EGO_STRICT_EMIT_RESUME=0
Environment=EGO_STRICT_EPISODE_SECONDS=86400

# Strict 30Hz grid — align with z-production-egoverse.conf (JPEG path reference).
Environment=STRICT_IMU_BUFFER_MAX=4000
Environment=STRICT_SYNC_MISS_MAX=32
Environment=STRICT_TS_JUMP_NS=100000000
Environment=STRICT_MAX_CAM_OFFSET_NS=50000000
Environment=STRICT_REANCHOR_WARMUP_TICKS=10
Environment=STRICT_GRID_SLACK_NS=25000000
# Pilot defaults (2026-08-18 HaMeR ego-001 stable): short clips ≤75s / single segment.
Environment=STRICT_PRIMARY_RING_LEN=160
Environment=STRICT_RGB_RING_LEN=128
Environment=STRICT_DEPTH_RING_LEN=48
# Ring overflow > threshold marks CORRUPT; small tail at segment rotate is normal (default 32 / 2%).
Environment=EGO_RING_OVERFLOW_CORRUPT_THRESHOLD=32
Environment=EGO_RING_OVERFLOW_CORRUPT_RATIO=0.02
Environment=EGO_STRICT_DEPTH_CAUSAL=1
Environment=EGO_IMU_INTERPOLATE=1

# H264 sequential: wait on sync miss instead of advancing empty grid ticks.
Environment=EGO_STRICT_MISS_ADVANCE_GRID=0
# Lockstep quad gate only applies to legacy sequential mode (fsync_quad rejects misaligned commits).
Environment=EGO_QUAD_MAX_OFFSET_NS=16000000

# Pre-beep H264 readiness (short cap — no long operator wait).
Environment=EGO_H264_READY_MAX_S=4.0
Environment=EGO_H264_READY_MIN_RING=1
Environment=EGO_H264_READY_STREAK=30
Environment=EGO_CAPTURE_READY_BEEP=1

# Segment close quality gate (29.8–30.2 Hz effective).
Environment=EGO_STRICT_FPS_GATE=1
Environment=EGO_STRICT_FPS_GATE_FAST=1
Environment=EGO_STRICT_EFF_HZ_LO=29.8
Environment=EGO_STRICT_EFF_HZ_HI=30.2
# Tail segments from stop mid-rotate: skip timeline reject below 10s / 300 frames.
Environment=EGO_TIMELINE_MIN_FRAMES=300
Environment=EGO_TIMELINE_MIN_SPAN_S=10.0
# QA layering (A+C): capture close skips timeline; upload QC enforces 3% corpus gate.
Environment=EGO_TIMELINE_GATE=0
Environment=EGO_TIMELINE_CAPTURE_BLOCK=0
Environment=EGO_TIMELINE_UPLOAD_QC=1
Environment=EGO_TIMELINE_MAX_DEV=0.03
Environment=EGO_TIMELINE_STATS_MAX_DEV=0.05

# Segment-boundary H264: drain runs only on rollover (prepare_h264_segment_boundary), not a separate profile.
Environment=OAK_H264_BOUNDARY_DRAIN_MS=0
Environment=OAK_H264_BOUNDARY_DRAIN_ROUNDS=64

# Low-power standby between clips (full OAK off; not H264 pipeline warm).
Environment=EGO_PIPELINE_WARM_MODE=standby
Environment=EGO_PIPELINE_WARM_S=300
Environment=EGO_PIPELINE_WARM_ON_BATTERY_S=120

# Post-stop OAK warm idle in capture process (SIGUSR1 warm / SIGUSR2 fast resume).
Environment=EGO_OAK_WARM_IDLE=1
Environment=EGO_OAK_WARM_S=300
Environment=EGO_WARM_START_TIMEOUT_S=30
Environment=EGO_WARM_RESUME_PROBE_MIN_S=0.2
Environment=EGO_WARM_RESUME_PROBE_MAX_S=0.6
Environment=EGO_WARM_RESUME_H264_STREAK=12
Environment=EGO_WARM_RESUME_H264_MAX_S=2.0
