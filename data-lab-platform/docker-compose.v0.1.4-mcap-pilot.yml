# v0.1.4-mcap-pilot overlay — isolated MCAP pilot on 34 (does not replace v0.1.3 production).
# Usage (after image build):
#   docker compose -f docker-compose.yml \
#     -f data-lab-platform/docker-compose.platform.yml \
#     -f data-lab-platform/docker-compose.v0.1.4-mcap-pilot.yml up -d stream-ingest-mcap-pilot derive-worker-mcap-pilot

services:
  stream-ingest-mcap-pilot:
    image: data-lab-lerobot-studio:v0.1.4-mcap-rc
    profiles: ["mcap-pilot"]
    volumes:
      - ./data-storage/stream:/srv/stream
      - ./data-lab-platform/lerobot-studio/config/collection-station-tokens.json:/app/config/collection-station-tokens.json:ro
      - ./data-lab-platform/lerobot-studio/config/collection-stations.json:/app/config/collection-stations.json:ro
      - ./data-lab-platform/lerobot-studio/config/station-topology.json:/app/config/station-topology.json:ro
    environment:
      - STREAM_DATA_ROOT=/srv/stream
      - STATION_ID=ego-mcap-pilot
      - DERIVE_STANDALONE=1
    ports:
      - "7863:7862"

  derive-worker-mcap-pilot:
    image: data-lab-lerobot-studio:v0.1.4-mcap-rc
    profiles: ["mcap-pilot"]
    volumes:
      - ./data-storage/stream:/srv/stream
    environment:
      - STREAM_DATA_ROOT=/srv/stream
      - STATION_ID=ego-mcap-pilot
      - DERIVE_STANDALONE=1
