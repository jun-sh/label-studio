# Stream upload → dedicated ingest worker (control plane stays on lerobot:7860).
location ~ ^/lerobot/api/collection/stations/[^/]+/upload$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Station-Token $http_x_station_token;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass http://stream-ingest:7862;
}
