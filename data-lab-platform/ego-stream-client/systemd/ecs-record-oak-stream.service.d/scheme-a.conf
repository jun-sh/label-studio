# Drop-in for 214: Scheme A capture-only + production IO (300-frame segments).
[Service]
Environment=EGO_SEGMENT_ROOT=/home/server/cache/ego-lan-214/segments
Environment=EGO_SEGMENT_ACTIVE_ROOT=/dev/shm/ego-capture-active
Environment=EGO_CAPTURE_CHECKPOINT=/home/server/cache/ego-lan-214/segments/checkpoint.json
Environment=DATALAB_HEARTBEAT_URL=http://10.10.10.34:8080/lerobot/api/collection/stations/ego-lan-214/upload
Environment=EGO_EDGE_RING_ENABLED=0
Environment=CAPTURE_JPEG_MAX_EDGE=0
Environment=OAK_DEVICE_FPS=30
Environment=OAK_USE_IMAGEMANIP=0
Environment=OAK_HW_PREVIEW=0
Environment=OAK_HW_JPEG=1
Environment=OAK_H264=0
Environment=SEGMENT_H264=0
Environment=OAK_GPIO_FSYNC=0
Environment=OAK_LOOSE_SYNC=1
Environment=DATALAB_JPEG_QUALITY=50
Environment=SEGMENT_FRAME_BIN=1
Environment=SEGMENT_PERSIST_WORKERS=2
Environment=SEGMENT_PERSIST_QUEUE_MAX=512
Environment=EGO_SEGMENT_MAX_PENDING=10
Environment=SEGMENT_AUTO_PURGE_PENDING=1
Environment=SEGMENT_BACKPRESSURE_PENDING=1
Environment=OAK_ISP_SCALE_NUM=2
Environment=OAK_ISP_SCALE_DEN=3
Environment=EGO_SEGMENT_MAX_FRAMES=300
Environment=EGO_SEGMENT_MAX_SECONDS=45
Environment=EGO_SEGMENT_PERSIST_BATCH_FRAMES=64
Environment=EGO_SEGMENT_ROWS_BUFFER_LINES=64
Environment=EGO_SEGMENT_CHECKPOINT_EVERY=120
Environment=EGO_SEGMENT_FSYNC_ON_CLOSE=0
Environment=EGO_SEGMENT_REGISTRY_ON_CLOSE_ONLY=1
Environment=SEGMENT_FINALIZE_ASYNC=1
ExecStart=
ExecStart=/home/server/workspace/ego-studio/.venv/bin/python -m ego_capture_studio.cli.record_oak_stream \
  --fps 20 --imu-hz 100 \
  --task "Perform egocentric manipulation tasks at the laboratory workbench"
