services:
  nginx:
    build:
      context: .
      args:
        DEBIAN_USE_MIRROR: ${DEBIAN_USE_MIRROR:-yes}
        DEBIAN_APT_MAIN: ${DEBIAN_APT_MAIN:-http://mirrors.aliyun.com/debian}
        DEBIAN_APT_SECURITY: ${DEBIAN_APT_SECURITY:-http://mirrors.aliyun.com/debian-security}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        # ghproxy is unreachable on some networks; opt-in via USE_GITHUB_DOWNLOAD_MIRROR=ghproxy
        USE_GITHUB_DOWNLOAD_MIRROR: ${USE_GITHUB_DOWNLOAD_MIRROR:-off}
    # Local build only — same name as Docker Hub would let `docker-compose pull` overwrite your image.
    image: ${LABEL_STUDIO_IMAGE:-data-lab-label-studio:local}
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      app:
        condition: service_healthy
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
    #   Optional: Set nginx error log level (default: warn)
    #   Use 'warn' or higher to reduce noisy "client closed keepalive connection" messages
    #      - NGINX_ERROR_LOG_LEVEL=warn
    #   Optional: Specify SSL termination certificate & key
    #   Just drop your cert.pem and cert.key into folder 'deploy/nginx/certs'
    #      - NGINX_SSL_CERT=/certs/cert.pem
    #      - NGINX_SSL_CERT_KEY=/certs/cert.key
    volumes:
      - ./mydata:/label-studio/data:rw
      - ./deploy/nginx/certs:/certs:ro
      - ./label_studio/core/static_build:/label-studio/label_studio/core/static_build:ro
    #   Optional: Override nginx default conf
    #      - ./deploy/my.conf:/etc/nginx/nginx.conf
    command: nginx

  app:
    stdin_open: true
    tty: true
    build:
      context: .
      args:
        DEBIAN_USE_MIRROR: ${DEBIAN_USE_MIRROR:-yes}
        DEBIAN_APT_MAIN: ${DEBIAN_APT_MAIN:-http://mirrors.aliyun.com/debian}
        DEBIAN_APT_SECURITY: ${DEBIAN_APT_SECURITY:-http://mirrors.aliyun.com/debian-security}
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
        # ghproxy is unreachable on some networks; opt-in via USE_GITHUB_DOWNLOAD_MIRROR=ghproxy
        USE_GITHUB_DOWNLOAD_MIRROR: ${USE_GITHUB_DOWNLOAD_MIRROR:-off}
    # Local build only — same name as Docker Hub would let `docker-compose pull` overwrite your image.
    image: ${LABEL_STUDIO_IMAGE:-data-lab-label-studio:local}
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      # Shared default for docs/API/changelog when individual URLs are unset (RFC 2606 placeholder; replace in prod).
      - DATA_LAB_PUBLIC_BASE_URL=${DATA_LAB_PUBLIC_BASE_URL:-https://example.com}
      # Optional per-link overrides (leave unset to use DATA_LAB_PUBLIC_BASE_URL for all three).
      - DATA_LAB_DOCUMENTATION_URL=${DATA_LAB_DOCUMENTATION_URL:-}
      - DATA_LAB_API_DOCS_URL=${DATA_LAB_API_DOCS_URL:-}
      - DATA_LAB_CHANGELOG_URL=${DATA_LAB_CHANGELOG_URL:-}
      - JSON_LOG=1
    #      - LOG_LEVEL=DEBUG
    volumes:
      - ./mydata:/label-studio/data:rw
      # Dev: pick up Data Lab routes/views/templates without rebuilding the image.
      - ./label_studio/core/urls.py:/label-studio/label_studio/core/urls.py:ro
      - ./label_studio/core/views.py:/label-studio/label_studio/core/views.py:ro
      - ./label_studio/core/collection_import.py:/label-studio/label_studio/core/collection_import.py:ro
      - ./label_studio/data_manager/urls.py:/label-studio/label_studio/data_manager/urls.py:ro
      - ./label_studio/templates:/label-studio/label_studio/templates:ro
      - ./label_studio/users/templates:/label-studio/label_studio/users/templates:ro
      - ./label_studio/core/static:/label-studio/label_studio/core/static:ro
      - ./label_studio/core/static_build:/label-studio/label_studio/core/static_build:rw
    command: label-studio-uwsgi
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  db:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    hostname: db
    restart: unless-stopped
    # Optional: Enable TLS on PostgreSQL
    # Just drop your server.crt and server.key into folder 'deploy/pgsql/certs'
    # NOTE: Both files must have permissions u=rw (0600) or less
    #    command: >
    #      -c ssl=on
    #      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
    #      -c ssl_key_file=/var/lib/postgresql/certs/server.key
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/lib/postgresql/data
      - ./deploy/pgsql/certs:/var/lib/postgresql/certs:ro
