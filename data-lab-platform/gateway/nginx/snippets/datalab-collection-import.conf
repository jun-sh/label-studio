# Browser offline import (Django proxy → stream-ingest). Tar.zst processing can take several minutes.
location ~ ^/api/collection/stations/[^/]+/import {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass http://label_studio_app;
    include /etc/nginx/snippets/datalab-inject.conf;
}
