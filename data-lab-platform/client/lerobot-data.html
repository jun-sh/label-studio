<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>数据 · Data Lab</title>
  <link rel="shortcut icon" href="/static/images/favicon.ico" />
  <link rel="stylesheet" href="/react-app/main.css" />
  <link rel="stylesheet" href="/_datalab/lerobot-data-page.css?v=5" />
  <script>
    (function () {
      var theme = window.localStorage.getItem("preferred-color-scheme");
      if (theme === "Auto") {
        theme =
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "Dark"
            : "Light";
      }
      if (!theme) theme = "Light";
      document.documentElement.setAttribute("data-color-scheme", theme.toLowerCase());
    })();
  </script>
</head>
<body class="datalab-page">
  <header class="datalab-page__header">
    <a class="datalab-page__brand" href="/projects">Data Lab</a>
    <nav class="datalab-page__nav" aria-label="主导航">
      <a class="datalab-page__nav-link" href="/projects">项目</a>
      <a class="datalab-page__nav-link" href="/organization">组织</a>
      <a class="datalab-page__nav-link datalab-page__nav-link--active" href="/lerobot-data">数据</a>
    </nav>
  </header>
  <main class="datalab-page__main">
    <iframe
      id="lerobot-frame"
      class="datalab-page__frame"
      src="/lerobot/?url=sample%3A%2F%2Fsensexperience_ego"
      title="LeRobot Dataset Visualizer"
      allow="fullscreen"
    ></iframe>
  </main>
  <script src="/_datalab/lerobot-data-page.js?v=6"></script>
</body>
</html>
