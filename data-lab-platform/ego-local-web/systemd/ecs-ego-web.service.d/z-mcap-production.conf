# ego-001 MCAP production — mobile UI starts VPU H.264 MCAP capture (not JPEG stream).
[Service]
Environment=EGO_STATION_ID=ego-001
Environment=EGO_SEGMENT_ROOT=/home/server/cache/ego-001/segments
Environment=EGO_SEGMENT_ACTIVE_ROOT=/tmp/ego-001-mcap-active
Environment=EGO_CAPTURE_CHECKPOINT=/home/server/cache/ego-001/checkpoint.json
Environment=EGO_PREVIEW_POLL_MS=500
Environment=EGO_CAPTURE_TARGET=ecs-oak-mcap-capture-stack.target
Environment=EGO_CAPTURE_RECORD_UNIT=ecs-record-oak-mcap.service
Environment=EGO_PREVIEW_URL=http://127.0.0.1:8765/preview/front_left/jpg
Environment=EGO_PIPELINE_WARM_MODE=standby
Environment=EGO_PIPELINE_WARM_S=300
Environment=EGO_PIPELINE_WARM_ON_BATTERY_S=120
Environment=EGO_STRICT_EFF_HZ_LO=29.8
