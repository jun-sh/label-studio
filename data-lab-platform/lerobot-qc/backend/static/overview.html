<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QC overview · Datalab</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="dl-header">
    <a class="dl-header__trigger" id="dlHomeLink" href="/" aria-label="Datalab">
      <img class="dl-header__logo" src="/static/datalab-logo.svg" alt="Datalab" width="142" height="22" />
    </a>
    <div class="dl-header__context">
      <nav class="dl-breadcrumbs" aria-label="Breadcrumb">
        <ol class="dl-breadcrumbs__list">
          <li class="dl-breadcrumbs__item"><a id="ovCrumbRoot" href="./">Data QC</a></li>
          <li class="dl-breadcrumbs__item"><span id="ovTitle">Overview</span></li>
        </ol>
      </nav>
      <div class="dl-header__actions">
        <a class="dl-header__btn" id="ovBackLink" href="./">Back to review</a>
      </div>
    </div>
  </header>
  <div class="ls-app ls-ov">
    <section class="ls-panel ls-ov-controls">
      <label class="ls-ov-field">
        <span id="ovCollectionLabel">Collection</span>
        <select id="ovCollection"></select>
      </label>
      <label class="ls-ov-field ls-ov-search">
        <span id="ovSearchLabel">Package</span>
        <input id="ovSearch" type="search" autocomplete="off" />
      </label>
      <button type="button" class="ls-btn ls-btn-ghost" id="ovRefresh">Refresh</button>
      <p class="ls-helper ls-ov-totals" id="ovTotals" aria-live="polite"></p>
    </section>

    <nav class="ls-ov-stages" id="ovStages" aria-label="Filter by stage"></nav>

    <section class="ls-panel ls-ov-table-wrap">
      <p class="ls-helper" id="ovStatus"></p>
      <table class="ls-ov-table" id="ovTable" hidden>
        <thead>
          <tr>
            <th data-sort="id" id="ovColPackage">Package</th>
            <th data-sort="stage" id="ovColStage">Stage</th>
            <th data-sort="progress" id="ovColProgress">Review progress</th>
            <th data-sort="suspicious" class="num" id="ovColSuspicious">Suspicious</th>
            <th data-sort="instruction_overrides" class="num" id="ovColOverrides">Instr. fixes</th>
            <th data-sort="delivery" id="ovColDelivery">Delivery</th>
            <th data-sort="last_qc_change_at" id="ovColLastChange">Last review</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="ovBody"></tbody>
      </table>
    </section>
  </div>
  <script src="/static/i18n.js"></script>
  <script src="/static/overview.js"></script>
</body>
</html>
