# ego-002 station-specific camera topology (physical socket layout on 52 helmet).
# Calibrated 2026-10-06: differs from ego-001 — do not copy socket_to_role from ego-001.
# Deploy: EGO_TOPOLOGY_FILE=/home/server/workspace/ego-studio/config/camera_topology_ego-002.yaml

topology_id: ego-002-physical
version: 2
board_profile: OAK-FFC-4P-Ego
camera_optics: pinhole
description: ego-002 helmet — CAM_A rear_left, CAM_B front_right, CAM_C rear_right, CAM_D front_left

primary_socket: CAM_D
head_right_socket: CAM_B

socket_to_role:
  CAM_A: rear_left
  CAM_B: front_right
  CAM_C: rear_right
  CAM_D: front_left

role_to_lerobot_key:
  front_left: observation.images.camera_front_left
  front_right: observation.images.camera_front_right
  rear_left: observation.images.camera_rear_left
  rear_right: observation.images.camera_rear_right

viewer_display_order:
  - front_left
  - front_right
  - rear_left
  - rear_right

viewer_labels:
  zh:
    front_left: 前左
    front_right: 前右
    rear_left: 后左
    rear_right: 后右
  en:
    front_left: Front Left
    front_right: Front Right
    rear_left: Rear Left
    rear_right: Rear Right

strict_sync:
  causal_sockets:
    - CAM_B
    - CAM_C
