# LeRobot Annotate — path-prefixed reverse proxy (Compose service :7861).

location /lerobot-annotate/api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_connect_timeout 90;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "SAMEORIGIN" always;
    proxy_pass http://embodied-annotate:7861/api/;
}

location /lerobot-annotate/static/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "SAMEORIGIN" always;
    gzip off;
    proxy_pass http://embodied-annotate:7861/static/;
    sub_filter_once off;
    sub_filter_types application/javascript text/javascript;
    sub_filter "'/api/" "'/lerobot-annotate/api/";
    sub_filter '"/api/' '"/lerobot-annotate/api/';
    sub_filter "`/api/" "`/lerobot-annotate/api/";
    # Rewrite legacy host default dataset path (app.js DEMO_LOCAL_DATASET) without editing source.
    sub_filter '/media/user01/7234c6f9-112e-4b82-925d-7b86065a5f4a/workspace/lerobot-annotate/data/pusht' '/data/datasets/pusht';
}

location /lerobot-annotate/ {
    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_connect_timeout 90;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    add_header X-Frame-Options "SAMEORIGIN" always;
    proxy_pass http://embodied-annotate:7861/;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/static/' 'href="/lerobot-annotate/static/';
    sub_filter 'src="/static/' 'src="/lerobot-annotate/static/';
}

location = /lerobot-annotate {
    return 301 /lerobot-annotate/$is_args$args;
}
