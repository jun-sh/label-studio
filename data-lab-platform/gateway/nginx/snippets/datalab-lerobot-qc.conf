# Terminal QC — path-prefixed reverse proxy (Compose service lerobot-qc :7863).

# Legacy path → /qc/
location ~ ^/lerobot-qc(/.*)?$ {
    absolute_redirect off;
    return 301 /qc$1$is_args$args;
}

# Plan A: bypass LS react bundle; send project QC routes to standalone SPA.
location ~ ^/projects/[0-9]+/lerobot-qc/?$ {
    absolute_redirect off;
    return 302 /qc/?datalab_embed=1&lang=zh-Hans$is_args$args;
}

location /qc/api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_connect_timeout 90;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "SAMEORIGIN" always;
    proxy_pass http://lerobot-qc:7863/api/;
}

location /qc/static/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "SAMEORIGIN" always;
    gzip off;
    proxy_pass http://lerobot-qc:7863/static/;
}

location /qc/ {
    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_connect_timeout 90;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    proxy_buffering off;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    add_header X-Frame-Options "SAMEORIGIN" always;
    proxy_pass http://lerobot-qc:7863/;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'href="/static/' 'href="/qc/static/';
    sub_filter 'src="/static/' 'src="/qc/static/';
}

location = /qc {
    absolute_redirect off;
    add_header Cache-Control "no-store" always;
    return 302 /qc/$is_args$args;
}
