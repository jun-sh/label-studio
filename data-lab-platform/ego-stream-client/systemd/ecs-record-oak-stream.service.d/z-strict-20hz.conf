# EGO embodied capture PRODUCTION DEFAULT (strict 20Hz).
# Approved: Round 9 soak 2026-06-06 (110/110 segments, go_live=true).
# Requires: ecs-upload-segments-loop + ecs-station-heartbeat (capture has NO heartbeat).
# Rollback: rm this drop-in, daemon-reload, restart ecs-record-oak-stream.
[Service]
Environment=EGO_STRICT_20HZ=1
Environment=EGO_IMU_INTERPOLATE=1
Environment=EGO_FRAME_INTERVAL_MS=50
Environment=OAK_DEVICE_FPS=30
Environment=OAK_LOOSE_SYNC=1
Environment=OAK_GPIO_FSYNC=1
Environment=OAK_LOOSE_SYNC=0
Environment=STRICT_PRIMARY_RING_LEN=96
Environment=STRICT_RGB_RING_LEN=64
Environment=STRICT_DEPTH_RING_LEN=24
Environment=EGO_STRICT_DEPTH_CAUSAL=1
Environment=STRICT_CAUSAL_OAK_SOCKETS=CAM_B,CAM_C
Environment=STRICT_TS_JUMP_NS=100000000
Environment=STRICT_MAX_CAM_OFFSET_NS=50000000
Environment=STRICT_REANCHOR_WARMUP_TICKS=10
Environment=STRICT_GRID_SLACK_NS=35000000
Environment=STRICT_REANCHOR_LOG=1
Environment=STRICT_SYNC_MISS_MAX=24
Environment=HEAD_RIGHT_OAK_SOCKET=CAM_B
Environment=DEPTH_OAK_SOCKET=CAM_C
Environment=SEGMENT_AUTO_PURGE_PENDING=0
Environment=EGO_SEGMENT_MAX_PENDING=160
Environment=SEGMENT_PERSIST_WORKERS=1
Environment=SEGMENT_PERSIST_QUEUE_MAX=512
Environment=SEGMENT_BACKPRESSURE_PENDING=0
Environment=EGO_STRICT_EPISODE_SECONDS=86400
Environment=EGO_PENDING_FAST_RESCAN_S=30
Environment=EGO_CAPTURE_NO_HEARTBEAT=1
Environment=STRICT_IMU_BUFFER_MAX=2000
