# Static Data Lab shell extension (menu inject + iframe host).
# Mounted from compose: ./data-lab-platform/client -> /extensions

location /_datalab/ {
    alias /extensions/;
    default_type application/octet-stream;
    add_header Cache-Control "no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
}
