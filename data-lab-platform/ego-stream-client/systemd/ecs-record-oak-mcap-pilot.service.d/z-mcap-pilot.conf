# MCAP pilot capture — isolated from z-production-egoverse.conf / ego-001.
# Enable only for feat/ego-mcap-pi testing on 130:
#   systemctl --user enable --now ecs-record-oak-mcap-pilot.service
# Production capture (ecs-record-oak-stream) must remain on JPEG DLB1.

[Service]
Environment=EGO_STATION_ID=ego-mcap-pilot
Environment=EGO_SEGMENT_ROOT=/home/server/cache/ego-mcap-pilot/segments
Environment=EGO_SEGMENT_ACTIVE_ROOT=/tmp/ego-mcap-pilot-active
Environment=EGO_CAPTURE_CHECKPOINT=/home/server/cache/ego-mcap-pilot/checkpoint.json

Environment=SEGMENT_MCAP=1
Environment=SEGMENT_FRAME_BIN=0
Environment=UPLOAD_PROTOCOL=mcap

Environment=OAK_HW_JPEG=1
Environment=OAK_H264=0
Environment=SEGMENT_H264=0
Environment=EGO_CAPTURE_JPEG_ONLY=1

Environment=EGO_FRAME_INTERVAL_MS=33
Environment=EGO_CAPTURE_FPS=30
Environment=EGO_CAPTURE_IMU_HZ=200
Environment=OAK_DEVICE_FPS=30
Environment=OAK_GPIO_FSYNC=1
Environment=EGO_CAPTURE_NO_HEARTBEAT=1

Environment=EGO_SEGMENT_MAX_SECONDS=75
Environment=EGO_SEGMENT_MAX_FRAMES=1800
Environment=SEGMENT_PERSIST_QUEUE_MAX=2048
