# ego-standard production capture: 30Hz JPEG + IMU 200Hz on 130; 34 ingest muxes frame_bin → MP4.
# Replaces four-lane H264 sequential (could not sustain 30fps on ego-001 hardware).

[Service]
Environment=EGO_FRAME_INTERVAL_MS=33
Environment=EGO_IMU_INTERPOLATE=1
Environment=EGO_CAPTURE_FPS=30
Environment=EGO_CAPTURE_IMU_HZ=200
Environment=OAK_DEVICE_FPS=30
Environment=OAK_GPIO_FSYNC=1
Environment=OAK_LOOSE_SYNC=0
Environment=OAK_ISP_SCALE_NUM=2
Environment=OAK_ISP_SCALE_DEN=3
Environment=CAPTURE_JPEG_MAX_EDGE=0
Environment=OAK_HW_JPEG=1
Environment=OAK_HW_PREVIEW=1
Environment=OAK_H264=0
Environment=OAK_HW_PREVIEW_H264=0
Environment=SEGMENT_H264=0
Environment=SEGMENT_H264_LEGACY_APPEND=0
Environment=SEGMENT_FRAME_BIN=1
Environment=DATALAB_JPEG_QUALITY=48
Environment=PREVIEW_FPS=15
Environment=PREVIEW_MAX_EDGE=1280
Environment=PREVIEW_JPEG_QUALITY=75
Environment=OPENCV_NUM_THREADS=2
Environment=STRICT_IMU_BUFFER_MAX=4000
Environment=STRICT_SYNC_MISS_MAX=32
Environment=STRICT_TS_JUMP_NS=100000000
Environment=STRICT_MAX_CAM_OFFSET_NS=50000000
Environment=STRICT_REANCHOR_WARMUP_TICKS=10
Environment=STRICT_GRID_SLACK_NS=25000000
Environment=STRICT_PRIMARY_RING_LEN=128
Environment=STRICT_RGB_RING_LEN=96
Environment=STRICT_DEPTH_RING_LEN=32
Environment=EGO_STRICT_DEPTH_CAUSAL=0
Environment=EGO_TOPOLOGY_FILE=/home/server/workspace/ego-studio/src/ego_capture_studio/capture/config/camera_topology_standard.json
Environment=EGO_SEGMENT_ACTIVE_ROOT=/dev/shm/ego-capture-active
Environment=SEGMENT_PERSIST_WORKERS=2
Environment=SEGMENT_PERSIST_QUEUE_MAX=512
Environment=SEGMENT_FINALIZE_ASYNC=1
Environment=EGO_SEGMENT_FSYNC_ON_CLOSE=0
Environment=EGO_SEGMENT_REGISTRY_ON_CLOSE_ONLY=1
Environment=EGO_SEGMENT_PERSIST_BATCH_FRAMES=48
Environment=EGO_SEGMENT_ROWS_BUFFER_LINES=48
Environment=EGO_SEGMENT_CHECKPOINT_EVERY=150
Environment=EGO_SEGMENT_MAX_FRAMES=1800
Environment=EGO_SEGMENT_MAX_SECONDS=75
Environment=EGO_SEGMENT_MAX_PENDING=24
Environment=SEGMENT_AUTO_PURGE_PENDING=1
Environment=SEGMENT_BACKPRESSURE_PENDING=1
Environment=EGO_CAPTURE_NO_HEARTBEAT=1
Environment=EGO_STRICT_EPISODE_SECONDS=86400
Environment=EGO_PENDING_FAST_RESCAN_S=20
Environment=UPLOAD_PROTOCOL=tarzst
