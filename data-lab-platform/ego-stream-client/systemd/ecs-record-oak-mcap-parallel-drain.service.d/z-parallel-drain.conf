# Parallel USB drain POC — feat/ego-parallel-drain-poc only.
# Enable:
#   git checkout feat/ego-parallel-drain-poc && deploy
#   systemctl --user disable --now ecs-record-oak-mcap.service
#   systemctl --user enable --now ecs-record-oak-mcap-parallel-drain.service
# Revert to production:
#   systemctl --user disable --now ecs-record-oak-mcap-parallel-drain.service
#   systemctl --user enable --now ecs-record-oak-mcap.service
#   git checkout main  # or deploy-release

[Service]
UnsetEnvironment=EGO_STATION_ID EGO_SEGMENT_ROOT EGO_SEGMENT_ACTIVE_ROOT EGO_CAPTURE_CHECKPOINT EGO_UPLOAD_URL DATALAB_HEARTBEAT_URL STATION_UPLOAD_TOKEN UPLOAD_PROTOCOL

Environment=EGO_STATION_ID=ego-parallel-drain-poc
Environment=EGO_SEGMENT_ROOT=/home/server/cache/ego-parallel-drain-poc/segments
Environment=EGO_SEGMENT_ACTIVE_ROOT=/tmp/ego-parallel-drain-poc-active
Environment=EGO_CAPTURE_CHECKPOINT=/home/server/cache/ego-parallel-drain-poc/checkpoint.json

Environment=SEGMENT_MCAP=1
Environment=SEGMENT_FRAME_BIN=0
Environment=UPLOAD_PROTOCOL=mcap
Environment=MCAP_VIDEO_CODEC=h264

Environment=OAK_HW_JPEG=0
Environment=OAK_H264=1
Environment=SEGMENT_H264=1
Environment=EGO_CAPTURE_JPEG_ONLY=0
Environment=STRICT_RGB_YIELD_MAX_MS=50
Environment=STRICT_DEPTH_YIELD_MAX_MS=50

Environment=OAK_H264_SEQUENTIAL=1
Environment=OAK_CAM_QUEUE_MAX=32
Environment=OAK_H264_BITRATE_KBPS=6000
Environment=OAK_H264_KEYFRAME_FREQUENCY=30
Environment=SEGMENT_H264_MUX_MODE=copy

Environment=EGO_FRAME_INTERVAL_MS=33
Environment=EGO_CAPTURE_FPS=30
Environment=EGO_CAPTURE_IMU_HZ=200
Environment=OAK_DEVICE_FPS=30
Environment=OAK_GPIO_FSYNC=1

# Preview off main strict-sync loop; parallel preview drain thread handles UI.
Environment=OAK_HW_PREVIEW_H264=1
Environment=OAK_HW_PREVIEW_H264_CAMS=front_left
Environment=PREVIEW_MAX_EDGE=384
Environment=PREVIEW_FPS=4
Environment=EGO_STRICT_SYNC_PREVIEW_DRAIN=0
Environment=EGO_CAPTURE_NO_HEARTBEAT=1

# Parallel drain + device-tick sync (POC).
Environment=EGO_CAPTURE_SYNC_MODE=device_tick
Environment=EGO_PARALLEL_DRAIN_BATCH=128
Environment=EGO_PARALLEL_IDLE_SLEEP_US=50
Environment=EGO_PARALLEL_SPIN_ROUNDS=128
Environment=EGO_DEVICE_TICK_BURST_MAX=8
Environment=EGO_DEVICE_TICK_IDLE_SLEEP_US=30
Environment=EGO_CAPTURE_PROFILE=1
Environment=EGO_CAPTURE_PROFILE_EVERY=90

Environment=EGO_SEGMENT_MAX_SECONDS=75
Environment=EGO_SEGMENT_MAX_FRAMES=1800
Environment=SEGMENT_PERSIST_QUEUE_MAX=2048
Environment=SEGMENT_PERSIST_WORKERS=2

Environment=STRICT_IMU_BUFFER_MAX=4000
Environment=STRICT_SYNC_MISS_MAX=32
Environment=STRICT_TS_JUMP_NS=100000000
Environment=STRICT_MAX_CAM_OFFSET_NS=50000000
Environment=STRICT_REANCHOR_WARMUP_TICKS=10
Environment=STRICT_GRID_SLACK_NS=25000000
Environment=STRICT_PRIMARY_RING_LEN=128
Environment=STRICT_RGB_RING_LEN=96
Environment=STRICT_DEPTH_RING_LEN=32
Environment=EGO_STRICT_DEPTH_CAUSAL=1
Environment=EGO_IMU_INTERPOLATE=1
Environment=EGO_STRICT_MISS_ADVANCE_GRID=0

Environment=EGO_H264_READY_MAX_S=4.0
Environment=EGO_H264_READY_MIN_RING=1
Environment=EGO_H264_READY_STREAK=30
Environment=EGO_CAPTURE_READY_BEEP=1

Environment=EGO_STRICT_FPS_GATE=1
Environment=EGO_STRICT_EFF_HZ_LO=29.8
Environment=EGO_STRICT_EFF_HZ_HI=30.2

Environment=EGO_PIPELINE_WARM_MODE=standby
Environment=EGO_PIPELINE_WARM_S=300
Environment=EGO_PIPELINE_WARM_ON_BATTERY_S=120

# Isolated ingest overlay on 34 (provision separately).
Environment=EGO_UPLOAD_URL=http://10.10.10.34:7865/lerobot/api/collection/stations/ego-parallel-drain-poc/upload
Environment=DATALAB_HEARTBEAT_URL=http://10.10.10.34:7865/lerobot/api/collection/stations/ego-parallel-drain-poc/upload
Environment=STATION_UPLOAD_TOKEN=dl-upload-ego-parallel-drain-poc-v1
Environment=EGO_STRICT_EPISODE_SECONDS=60
