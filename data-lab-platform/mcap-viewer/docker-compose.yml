# MCAP web viewer — Lichtblick + file browser
#
# Usage (from repo root):
#   MCAP_DIR=/tmp/ego_pr1_step2 docker compose -f data-lab-platform/mcap-viewer/docker-compose.yml up -d
#
# Then open:
#   http://localhost:8877/          — file browser (click Open, or drag local .mcap)
#   http://localhost:8765/          — Lichtblick viewer directly (drag .mcap if file is local)

services:
  lichtblick:
    image: ghcr.io/lichtblick-suite/lichtblick:latest
    restart: unless-stopped
    ports:
      - "${MCAP_VIEWER_PORT:-8765}:8080"
    volumes:
      - ./default-layout.json:/lichtblick/default-layout.json:ro

  mcap-files:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${MCAP_FILES_PORT:-8877}:8877"
    volumes:
      - ${MCAP_DIR:-/tmp/ego_pr1_step2}:/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro
    depends_on:
      - mcap-api

  mcap-api:
    image: python:3.11-alpine
    restart: unless-stopped
    command: ["python3", "/app/list-files.py"]
    environment:
      - MCAP_DATA_ROOT=/data
      - MCAP_API_PORT=8878
    volumes:
      - ${MCAP_DIR:-/tmp/ego_pr1_step2}:/data:ro
      - ./list-files.py:/app/list-files.py:ro
