# Hot-tier storage policy (34): 20GB quota, 7-day retention, P0 staging purge unchanged in stream-ingest.
# Cold migration: host cron runs scripts/storage/hot-tier-enforce.sh + archive-to-cold.sh
#
# Usage from repo root:
#   docker compose -f docker-compose.yml \
#     -f data-lab-platform/docker-compose.platform.yml \
#     -f data-lab-platform/docker-compose.storage.override.yml \
#     up -d stream-ingest lerobot stream-parquet-sync

services:
  stream-ingest:
    volumes:
      - ./data-lab-platform/lerobot-studio/ingest-server.mjs:/app/ingest-server.mjs:ro
      - ./data-lab-platform/lerobot-studio/stream-ingest.mjs:/app/stream-ingest.mjs:ro
      - /media/user01/7234c6f9-112e-4b82-925d-7b86065a5f4a/workspace/ego-archive:/cold-archive:rw
    environment:
      - STREAM_QUOTA_GB_EGO_LAN_214=20
      - STREAM_RETENTION_DAYS=7
      - STREAM_WINDOW_MINUTES=30
      - STREAM_SEGMENT_MINUTES=5
      - STREAM_DISK_HIGH_WATER=0.9
      - STREAM_DISK_TARGET=0.75
      - STREAM_CLEANUP_INTERVAL_MS=300000
      - STREAM_CLEANUP_DEBOUNCE_MS=60000
      - STREAM_STAGING_EMERGENCY_BYTES=268435456
      - STREAM_ARCHIVE_PURGE_MAX=2

  stream-parquet-sync:
    environment:
      - STREAM_QUOTA_GB_EGO_LAN_214=20
      - STREAM_RETENTION_DAYS=7
      - STREAM_WINDOW_MINUTES=30

  lerobot:
    volumes:
      - ./data-lab-platform/lerobot-studio/stream-ingest.mjs:/app/stream-ingest.mjs:ro
      - ./data-lab-platform/lerobot-studio/server.mjs:/app/server.mjs:ro
      - ./data-lab-platform/lerobot-studio/preview-proxy.mjs:/app/preview-proxy.mjs:ro
      - ./data-lab-platform/lerobot-studio/branding:/app/branding:ro
    environment:
      - STREAM_QUOTA_GB_EGO_LAN_214=20
      - STREAM_RETENTION_DAYS=7
      - STREAM_WINDOW_MINUTES=30
      - STREAM_SEGMENT_MINUTES=5
