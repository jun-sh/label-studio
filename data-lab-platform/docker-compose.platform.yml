# Data Lab platform overlay — zero Label Studio source changes.
#
# Usage (from repo root):
#   docker-compose -f docker-compose.yml -f data-lab-platform/docker-compose.platform.yml up -d --build
#
# Unified entry: http://10.10.10.34:8080
# LeRobot visualizer: http://10.10.10.34:8080/lerobot/
# Embedded route:     http://10.10.10.34:8080/data
# LeRobot annotate:   http://10.10.10.34:8080/lerobot-annotate/  (embodied-annotate:7861 via nginx)

services:
  nginx:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_HOST=app
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://10.10.10.34:8080}
    volumes:
      - ./data-lab-platform/gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data-lab-platform/gateway/nginx/snippets:/etc/nginx/snippets:ro
      - ./data-lab-platform/client:/extensions:ro
    depends_on:
      app:
        condition: service_healthy
      lerobot:
        condition: service_healthy
      stream-ingest:
        condition: service_healthy
      embodied-annotate:
        condition: service_healthy

  app:
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-http://10.10.10.34:8080}
      - DATA_LAB_PUBLIC_BASE_URL=${DATA_LAB_PUBLIC_BASE_URL:-http://10.10.10.34:8080}
      - STREAM_INGEST_INTERNAL_URL=http://stream-ingest:7862
      - COLLECTION_STATION_TOKENS_JSON=/datalab-config/collection-station-tokens.json
    volumes:
      - ./data-lab-platform/lerobot-studio/config/collection-station-tokens.json:/datalab-config/collection-station-tokens.json:ro

  stream-ingest:
    build:
      context: ./data-lab-platform/lerobot-studio
    image: ${LEROBOT_IMAGE:-data-lab-lerobot-studio:local}
    restart: unless-stopped
    entrypoint: ["node", "/app/ingest-server.mjs"]
    expose:
      - "7862"
    volumes:
      - ./data-storage/stream:/srv/stream
      - ./data-lab-platform/lerobot-studio/ingest-server.mjs:/app/ingest-server.mjs:ro
      - ./data-lab-platform/lerobot-studio/stream-ingest.mjs:/app/stream-ingest.mjs:ro
      - ./data-lab-platform/lerobot-studio/task-naming.mjs:/app/task-naming.mjs:ro
      - ./data-lab-platform/lerobot-studio/vendor:/app/vendor:ro
      - ./data-lab-platform/lerobot-studio/import-handlers.mjs:/app/import-handlers.mjs:ro
      - ./data-lab-platform/lerobot-studio/frame_bin_codec.mjs:/app/frame_bin_codec.mjs:ro
      - ./data-lab-platform/lerobot-studio/scripts/sync-stream-parquet.py:/app/scripts/sync-stream-parquet.py:ro
    user: "1000:1000"
    environment:
      - INGEST_PORT=7862
      - STREAM_DATA_ROOT=/srv/stream
      - COLLECTION_STATIONS_JSON=/app/config/collection-stations.json
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7862/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  stream-parquet-sync:
    build:
      context: ./data-lab-platform/lerobot-studio
      dockerfile: Dockerfile.stream-sync
    image: ${LEROBOT_STREAM_SYNC_IMAGE:-data-lab-stream-parquet-sync:local}
    restart: unless-stopped
    volumes:
      - ./data-storage/stream:/srv/stream
      - ./data-lab-platform/lerobot-studio/scripts/sync-stream-parquet.py:/scripts/sync-stream-parquet.py:ro
    user: "1000:1000"
    environment:
      - STREAM_SYNC_INTERVAL=5
      - STREAM_DATA_ROOT=/srv/stream

  lerobot:
    build:
      context: ./data-lab-platform/lerobot-studio
    image: ${LEROBOT_IMAGE:-data-lab-lerobot-studio:local}
    restart: unless-stopped
    expose:
      - "7860"
    volumes:
      - lerobot-studio-data:/srv/lerobot
      - lerobot-bundled-data:/srv/bundled
      - ./data-storage/stream:/srv/stream
      - ./data-storage/ego-archive:/cold-archive:ro
      - ./data-storage/samples:/datalab-samples:ro
      - ./data-lab-platform/lerobot-studio/branding:/app/branding:ro
      - ./data-lab-platform/lerobot-studio/server.mjs:/app/server.mjs:ro
      - ./data-lab-platform/lerobot-studio/stream-ingest.mjs:/app/stream-ingest.mjs:ro
      - ./data-lab-platform/lerobot-studio/task-naming.mjs:/app/task-naming.mjs:ro
      - ./data-lab-platform/lerobot-studio/vendor:/app/vendor:ro
      - ./data-lab-platform/lerobot-studio/preview-proxy.mjs:/app/preview-proxy.mjs:ro
      - ./data-lab-platform/lerobot-studio/frame_bin_codec.mjs:/app/frame_bin_codec.mjs:ro
    environment:
      - PORT=7860
      - NODE_ENV=production
      - LEROBOT_STUDIO_ROOT=/srv/lerobot
      - LEROBOT_STUDIO_UPSTREAM=${LEROBOT_STUDIO_UPSTREAM:-https://io-ai.tech}
      - DATALAB_SAMPLES_DIR=/datalab-samples
      - LEROBOT_SAMPLES_COS=https://io-lerobot-examples-1328702871.cos.accelerate.myqcloud.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7860/lerobot/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 300s

  embodied-annotate:
    build:
      context: ./data-lab-platform/embodied-annotate
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: ${EMBODIED_ANNOTATE_IMAGE:-data-lab-embodied-annotate:local}
    restart: unless-stopped
    expose:
      - "7861"
    volumes:
      - ./data-storage/embodied-annotate/cache:/data/cache
      - ./data-storage/embodied-annotate/exports:/data/exports
      - ./data-storage/embodied-annotate/datasets:/data/datasets
      - ./data-storage/samples:/datalab-samples:ro
    environment:
      - LEROBOT_ANNOTATE_CACHE=/data/cache
      - LEROBOT_ANNOTATE_EXPORT=/data/exports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7861/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  lerobot-studio-data:
  lerobot-bundled-data:
