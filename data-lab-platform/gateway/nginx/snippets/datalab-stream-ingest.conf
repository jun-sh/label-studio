# Stream upload → dedicated ingest worker (control plane stays on lerobot:7860).
location ~ ^/lerobot/api/collection/stations/[^/]+/upload$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Station-Token $http_x_station_token;
    proxy_set_header X-Upload-Protocol $http_x_upload_protocol;
    proxy_set_header X-Session-Id $http_x_session_id;
    proxy_set_header X-Segment-Id $http_x_segment_id;
    proxy_set_header X-Segment-Seq $http_x_segment_seq;
    proxy_set_header X-Content-Sha256 $http_x_content_sha256;
    proxy_set_header X-Session-Segment-Total $http_x_session_segment_total;
    proxy_connect_timeout 30s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_pass http://stream-ingest:7862;
}

