# Static Data Lab shell extension (menu inject + iframe host).
# Mounted from compose: ./data-lab-platform/client -> /extensions

location = /_datalab/shell.js {
    alias /extensions/shell.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Datalab-Shell-Version "10" always;
    etag off;
    if_modified_since off;
}

location = /_datalab/shell.css {
    alias /extensions/shell.css;
    default_type text/css;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
}

location /_datalab/ {
    alias /extensions/;
    default_type application/octet-stream;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Home: Datalab is embodied-data infrastructure, so / opens the pipeline overview
# (Django view core.views.overview_page) instead of the inherited Label Studio annotation
# workspace. 302, not 301, so the target can change without stale browser caches.
# Kept in this snippet (a directory mount) so changing it needs only `nginx -s reload`.
location = / {
    return 302 /overview$is_args$args;
}

# --- Gateway auth (Phase 0) -------------------------------------------------
# Overlay services (/lerobot, /qc, /lerobot-annotate) have no auth of their own.
# Locations that include datalab-require-login.inc ask Label Studio whether the
# caller is signed in (session cookie or `Authorization: Token ...`).
location = /_datalab_auth {
    internal;
    proxy_pass http://label_studio_app/api/current-user/whoami;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-URI $request_uri;
}

location @datalab_login {
    absolute_redirect off;
    return 302 /user/login/?next=$uri;
}
