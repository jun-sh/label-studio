# v0.0.8 edge capture: segment H264 MP4 in tar.zst (primary upload path).
# Prerequisite on 130: apt install ffmpeg
[Service]
Environment=OAK_HW_JPEG=0
Environment=OAK_H264=1
Environment=OAK_HW_PREVIEW_H264=0
Environment=SEGMENT_H264=1
Environment=SEGMENT_H264_LEGACY_APPEND=0
Environment=SEGMENT_FRAME_BIN=0
Environment=UPLOAD_PROTOCOL=tarzst
