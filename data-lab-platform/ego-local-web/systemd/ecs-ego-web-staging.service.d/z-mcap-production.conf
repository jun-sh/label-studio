# Align 8081 quad preview with ego-001 MCAP capture units (status gating only).
[Service]
Environment=EGO_STATION_ID=ego-001
Environment=EGO_CAPTURE_TARGET=ecs-oak-mcap-capture-stack.target
Environment=EGO_CAPTURE_RECORD_UNIT=ecs-record-oak-mcap.service
Environment=EGO_STANDBY_WAKE_WAIT_S=25
Environment=EGO_PREVIEW_POLL_MS=200
Environment=EGO_PREVIEW_END_WARM_IDLE=1
