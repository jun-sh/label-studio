# Single injection point — avoid loading shell.js twice (was breaking menu logic).
# Theme lock lives in shell.js (lockLightTheme); do not inject inline scripts (CSP nonce).
sub_filter '</head>' '<link rel="stylesheet" href="/_datalab/shell.css?v=24"/><script defer src="/_datalab/shell.js?v=24"></script></head>';
sub_filter_once on;
sub_filter_types text/html;
