# Track 2 VPU-H.264 MCAP POC — isolated from z-mcap-pilot.conf / ego-001 / Track 1 pilot.
# Enable only on feat/ego-mcap-track2-vpuh264 branch testing:
#   systemctl --user enable --now ecs-record-oak-mcap-track2.service
# Conflicts with ecs-record-oak-mcap-pilot — stop pilot before Track 2 recording.

[Service]
UnsetEnvironment=EGO_STATION_ID EGO_SEGMENT_ROOT EGO_SEGMENT_ACTIVE_ROOT EGO_CAPTURE_CHECKPOINT EGO_UPLOAD_URL DATALAB_HEARTBEAT_URL STATION_UPLOAD_TOKEN UPLOAD_PROTOCOL

Environment=EGO_STATION_ID=ego-mcap-track2
Environment=EGO_SEGMENT_ROOT=/home/server/cache/ego-mcap-track2/segments
Environment=EGO_SEGMENT_ACTIVE_ROOT=/tmp/ego-mcap-track2-active
Environment=EGO_CAPTURE_CHECKPOINT=/home/server/cache/ego-mcap-track2/checkpoint.json

Environment=SEGMENT_MCAP=1
Environment=SEGMENT_FRAME_BIN=0
Environment=UPLOAD_PROTOCOL=mcap

# VPU H.264 (Track 2) — NOT JPEG
Environment=MCAP_VIDEO_CODEC=h264

Environment=OAK_HW_JPEG=0
Environment=OAK_H264=1
Environment=SEGMENT_H264=1
Environment=EGO_CAPTURE_JPEG_ONLY=0

# v0.0.12 tuning (§14.3)
Environment=OAK_H264_SEQUENTIAL=1
Environment=OAK_CAM_QUEUE_MAX=32
Environment=OAK_H264_BITRATE_KBPS=6000
Environment=OAK_H264_KEYFRAME_FREQUENCY=30
Environment=SEGMENT_H264_MUX_MODE=copy

Environment=EGO_FRAME_INTERVAL_MS=33
Environment=EGO_CAPTURE_FPS=30
Environment=EGO_CAPTURE_IMU_HZ=200
Environment=OAK_DEVICE_FPS=30
Environment=OAK_GPIO_FSYNC=1
Environment=EGO_CAPTURE_NO_HEARTBEAT=1

Environment=EGO_SEGMENT_MAX_SECONDS=75
Environment=EGO_SEGMENT_MAX_FRAMES=1800
Environment=SEGMENT_PERSIST_QUEUE_MAX=2048

# Track2 ingest overlay :7864 (deploy separately on 34)
Environment=EGO_UPLOAD_URL=http://10.10.10.34:7864/lerobot/api/collection/stations/ego-mcap-track2/upload
Environment=DATALAB_HEARTBEAT_URL=http://10.10.10.34:7864/lerobot/api/collection/stations/ego-mcap-track2/upload
Environment=STATION_UPLOAD_TOKEN=dl-upload-ego-mcap-track2-v1
Environment=EGO_STRICT_EPISODE_SECONDS=35
